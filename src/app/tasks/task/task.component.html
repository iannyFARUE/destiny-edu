<app-card>
  <article [class.completed]="task().completed">
    <h2>{{ task().title }}</h2>
    <time [class.overdue]="isOverdue()">
      {{ task().dueDate | date: 'fullDate' }}
      @if (isOverdue()) {
        <span class="overdue-badge">Overdue</span>
      }
    </time>
    <p>{{ task().summary }}</p>
    <p class="actions">
      <button class="delete" (click)="onDeleteTask()">Delete</button>
      <button (click)="onToggleComplete()">{{ task().completed ? 'Reopen' : 'Complete' }}</button>
    </p>
  </article>
</app-card>
